<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sản phẩm</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="page-shell">
    <section id="login-view" class="login-layout">
        <div class="login-brand">
            <div class="brand-mark">P</div>
            <p class="eyebrow">PRODUCT SERVICE · SOA</p>
            <h1>Quản lý sản phẩm<br>trong một nơi.</h1>
           
        </div>
        <form id="login-form" class="card login-card">
            <h2>Đăng nhập</h2>
            <p class="muted">Nhập tài khoản</p>
            <label for="userName">Tên đăng nhập</label>
            <input id="userName" name="userName" autocomplete="username" placeholder="admin" required>
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required>
            <p id="login-error" class="feedback error" role="alert"></p>
            <button type="submit" class="button primary full-width">Đăng nhập</button>
            <p class="hint">Tài khoản theo CSDL mẫu: <strong>Admin</strong> / <strong>123456</strong></p>
        </form>
    </section>

    <section id="app-view" hidden>
        <header class="topbar">
            <a class="brand-link" href="/"><span class="brand-mark small">P</span> Product Service</a>
            <div class="account">
                <span id="account-name"></span>
                <button id="logout-button" class="button secondary">Đăng xuất</button>
            </div>
        </header>
        <section class="content">
            <div class="heading-row">
                <div>
                    <p class="eyebrow">KHO HÀNG</p>
                    <h1>Sản phẩm</h1>
                    <p class="muted">Quản lý danh mục sản phẩm của bạn.</p>
                </div>
                <button id="add-button" class="button primary">＋ Thêm sản phẩm</button>
            </div>
            <p id="app-feedback" class="feedback" role="status"></p>
            <div class="table-card">
                <div class="table-scroll">
                    <table>
                        <thead>
                        <tr><th>SẢN PHẨM</th><th>GIÁ</th><th>TỒN KHO</th><th>CẬP NHẬT</th><th></th></tr>
                        </thead>
                        <tbody id="product-rows"></tbody>
                    </table>
                </div>
                <div id="empty-state" class="empty-state" hidden>Chưa có sản phẩm nào.</div>
            </div>
        </section>
    </section>
</main>

<dialog id="product-dialog" class="product-dialog">
    <form id="product-form">
        <div class="dialog-heading">
            <div><p class="eyebrow">DANH MỤC</p><h2 id="dialog-title">Thêm sản phẩm</h2></div>
            <button type="button" id="close-dialog" class="icon-button" aria-label="Đóng">×</button>
        </div>
        <input id="product-id" type="hidden">
        <label for="product-name">Tên sản phẩm</label>
        <input id="product-name" maxlength="255" required>
        <label for="product-description">Mô tả</label>
        <textarea id="product-description" rows="3"></textarea>
        <div class="form-grid">
            <div><label for="product-price">Giá (₫)</label><input id="product-price" type="number" min="0" step="0.01" required></div>
            <div><label for="product-quantity">Số lượng</label><input id="product-quantity" type="number" min="0" step="1" required></div>
        </div>
        <p id="form-error" class="feedback error" role="alert"></p>
        <div class="dialog-actions">
            <button type="button" id="cancel-dialog" class="button secondary">Hủy</button>
            <button type="submit" class="button primary">Lưu sản phẩm</button>
        </div>
    </form>
</dialog>
<script src="/app.js"></script>
</body>
</html>
